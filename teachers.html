<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>강사 관리 | CANB 캠퍼스</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.16.0/styles/overlayscrollbars.min.css">
  <link rel="stylesheet" href="styles/common.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>

<div class="main-content">
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-title">강사 관리</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" title="알림" aria-label="알림">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
    </div>
  </header>

  <main class="page-content">
    <div class="page-header">
      <div class="page-header-left">
        <h1 class="page-title">강사 관리</h1>
        <p class="page-subtitle">강사 현황과 강의 담당 과목을 관리합니다</p>
      </div>
      <div class="page-header-actions">
        <button class="btn btn-secondary">시간표 보기</button>
        <button class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          강사 등록
        </button>
      </div>
    </div>

    <!-- KPI -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-card-header">
          <span class="kpi-label">전체 강사</span>
          <div class="kpi-icon blue" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg>
          </div>
        </div>
        <span class="kpi-value">24</span>
        <div class="kpi-change positive">▲ 2명 지난 학기 대비</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-card-header">
          <span class="kpi-label">정규 강사</span>
          <div class="kpi-icon green" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
        </div>
        <span class="kpi-value">18</span>
        <div class="kpi-change neutral">전체의 75%</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-card-header">
          <span class="kpi-label">시간 강사</span>
          <div class="kpi-icon amber" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
        </div>
        <span class="kpi-value">6</span>
        <div class="kpi-change neutral">전체의 25%</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-card-header">
          <span class="kpi-label">강사 1인 담당 학생</span>
          <div class="kpi-icon cyan" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          </div>
        </div>
        <span class="kpi-value">51.9명</span>
        <div class="kpi-change neutral">평균 기준</div>
      </div>
    </div>

    <!-- 과목별 강사 분포 차트 -->
    <div class="chart-grid-2 section">
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">과목별 강사 수</div>
          </div>
        </div>
        <div class="card-body">
          <div class="chart-container-md" role="img" aria-label="과목별 강사 분포 차트">
            <canvas id="teacherSubjectChart"></canvas>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <div class="card-title">강사별 담당 학생 수</div>
        </div>
        <div class="card-body">
          <div class="chart-container-md" role="img" aria-label="강사별 담당 학생 수 차트">
            <canvas id="teacherLoadChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- 강사 목록 -->
    <div class="filter-bar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" placeholder="강사 이름 검색..." aria-label="강사 검색">
      </div>
      <select class="filter-select" aria-label="과목 필터">
        <option>전체 과목</option>
        <option>수학</option>
        <option>영어</option>
        <option>과학</option>
        <option>국어</option>
        <option>코딩</option>
      </select>
      <select class="filter-select" aria-label="고용 형태">
        <option>전체</option>
        <option>정규직</option>
        <option>시간강사</option>
      </select>
    </div>
    <div class="card section">
      <div class="card-header">
        <div class="card-title">강사 목록</div>
      </div>
      <div class="card-body">
        <div class="table-wrapper">
          <table>
            <thead style="border-top: var(--border-default);">
              <tr>
                <th>강사</th>
                <th>담당 과목</th>
                <th>고용 형태</th>
                <th>경력</th>
                <th>담당 강좌</th>
                <th class="text-right">담당 학생</th>
                <th>수업 요일</th>
                <th>상태</th>
                <th class="text-center">액션</th>
              </tr>
            </thead>
            <tbody id="teacherBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

  <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.16.0/browser/overlayscrollbars.browser.es5.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script>
  initLayout('teachers.html');

  const teachers = [
    { name:'박지연', subject:'수학·국어', type:'정규직', career:'8년', courses:4, students:167, days:'월·화·수·목·금', status:'재직' },
    { name:'최준호', subject:'영어',      type:'정규직', career:'5년', courses:3, students:108, days:'월·화·수·목',   status:'재직' },
    { name:'김태현', subject:'수학',      type:'정규직', career:'12년',courses:3, students:117, days:'월·수·금',      status:'재직' },
    { name:'이미래', subject:'과학·국어', type:'정규직', career:'6년', courses:3, students:115, days:'화·목·토',      status:'재직' },
    { name:'강현우', subject:'코딩',      type:'정규직', career:'4년', courses:2, students:32,  days:'토',            status:'재직' },
    { name:'정다은', subject:'영어',      type:'정규직', career:'7년', courses:2, students:73,  days:'월·수·금',      status:'재직' },
    { name:'한재원', subject:'수학',      type:'시간강사', career:'3년', courses:2, students:85, days:'토·일',         status:'재직' },
    { name:'오수빈', subject:'국어·사회', type:'시간강사', career:'2년', courses:2, students:92, days:'화·목',         status:'재직' },
    { name:'윤민호', subject:'과학',      type:'시간강사', career:'5년', courses:1, students:30, days:'토',            status:'휴직' },
  ];

  const typeCls = { '정규직':'badge-primary','시간강사':'badge-neutral' };
  const stsCls  = { '재직':'badge-success','휴직':'badge-warning' };

  document.getElementById('teacherBody').innerHTML = teachers.map(t => `
    <tr>
      <td><div class="table-avatar">
        <div class="avatar-circle" style="background:var(--color-success-light);color:var(--color-success);">${t.name[0]}</div>
        ${t.name}
      </div></td>
      <td><span class="badge badge-neutral">${t.subject.split('·')[0]}</span>${t.subject.includes('·') ? ` <span class="badge badge-neutral" style="margin-left:2px;">${t.subject.split('·')[1]}</span>`:''}</td>
      <td><span class="badge ${typeCls[t.type]}">${t.type}</span></td>
      <td class="text-secondary">${t.career}</td>
      <td class="text-secondary">${t.courses}개</td>
      <td class="text-right" style="font-weight:var(--weight-medium);">${t.students}명</td>
      <td class="text-secondary" style="font-size:var(--text-xs);">${t.days}</td>
      <td><span class="badge ${stsCls[t.status]}">${t.status}</span></td>
      <td class="text-center">
        <button class="btn btn-secondary btn-sm">상세</button>
      </td>
    </tr>
  `).join('');

  const activeTeachers = teachers.filter(t=>t.status==='재직').slice(0,7);
  const maxStudents = Math.max(...activeTeachers.map(t=>t.students));

  let _charts = {};

  function buildCharts() {
    setChartDefaults();
    Object.values(_charts).forEach(ch => ch && ch.destroy());
    const c = getChartColors();

    _charts.subject = new Chart(document.getElementById('teacherSubjectChart'), {
      type: 'polarArea',
      data: {
        labels: ['수학','영어','과학','국어','코딩','사회'],
        datasets: [{ data:[8,6,4,4,2,2], backgroundColor:[c[0],c[1],c[1],c[1],c[3],c[3]] }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend:{ position:'bottom', labels:{ usePointStyle:true } } }
      }
    });

    _charts.load = new Chart(document.getElementById('teacherLoadChart'), {
      type: 'bar',
      data: {
        labels: activeTeachers.map(t=>t.name),
        datasets: [{ label:'담당 학생 수', data: activeTeachers.map(t=>t.students), backgroundColor: activeTeachers.map(t => t.students === maxStudents ? c[0] : c[3]), borderRadius:4, barPercentage:0.45 }]
      },
      options: {
        indexAxis: 'y',
        responsive: true, maintainAspectRatio: false,
        plugins: { legend:{ display:false } },
        scales: { x:{ beginAtZero:true }, y:{ grid:{ display:false } } }
      }
    });
  }

  buildCharts();
  window.addEventListener('themechange', buildCharts);
</script>
</body>
</html>
