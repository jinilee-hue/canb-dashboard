<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학생 관리 | CANB 캠퍼스</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.16.0/styles/overlayscrollbars.min.css">
  <link rel="stylesheet" href="styles/common.css">
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>

<div class="main-content">
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-title">학생 관리</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" title="내보내기" aria-label="내보내기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="icon-btn" title="알림" aria-label="알림">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
    </div>
  </header>

  <main class="page-content">
    <div class="page-header">
      <div class="page-header-left">
        <h1 class="page-title">학생 관리</h1>
        <p class="page-subtitle">전체 학생 현황을 조회하고 관리합니다</p>
      </div>
      <div class="page-header-actions">
        <button class="btn btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          내보내기
        </button>
        <button class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          학생 등록
        </button>
      </div>
    </div>

    <!-- KPI -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-card-header">
          <span class="kpi-label">전체 학생</span>
          <div class="kpi-icon blue" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
        </div>
        <span class="kpi-value">1,247</span>
        <div class="kpi-change positive">▲ 48명 이달 신규</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-card-header">
          <span class="kpi-label">재원생</span>
          <div class="kpi-icon green" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg>
          </div>
        </div>
        <span class="kpi-value">1,182</span>
        <div class="kpi-change neutral">전체의 94.8%</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-card-header">
          <span class="kpi-label">휴원</span>
          <div class="kpi-icon amber" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="10" y1="15" x2="10" y2="9"/><line x1="14" y1="15" x2="14" y2="9"/></svg>
          </div>
        </div>
        <span class="kpi-value">43</span>
        <div class="kpi-change positive">▲ 5명 지난달 대비</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-card-header">
          <span class="kpi-label">퇴원</span>
          <div class="kpi-icon red" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </div>
        </div>
        <span class="kpi-value">22</span>
        <div class="kpi-change negative">▼ 3명 지난달 대비</div>
      </div>
    </div>

    <!-- 필터 -->
    <div class="filter-bar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" placeholder="이름, 학번으로 검색..." aria-label="학생 검색">
      </div>
      <select class="filter-select" aria-label="과목 필터">
        <option value="">전체 과목</option>
        <option>수학</option>
        <option>영어</option>
        <option>과학</option>
        <option>국어</option>
        <option>코딩</option>
        <option>사회</option>
      </select>
      <select class="filter-select" aria-label="학년 필터">
        <option value="">전체 학년</option>
        <option>초등 4학년</option>
        <option>초등 5학년</option>
        <option>초등 6학년</option>
        <option>중등 1학년</option>
        <option>중등 2학년</option>
        <option>중등 3학년</option>
        <option>고등 1학년</option>
        <option>고등 2학년</option>
        <option>고등 3학년</option>
      </select>
      <select class="filter-select" aria-label="상태 필터">
        <option value="">전체 상태</option>
        <option>재원</option>
        <option>휴원</option>
        <option>퇴원</option>
      </select>
    </div>

    <!-- 테이블 -->
    <div class="card section">
      <div class="card-header">
        <div class="card-title">학생 목록</div>
        <span style="font-size:var(--text-sm);color:var(--color-text-tertiary);">총 1,247명</span>
      </div>
      <div class="card-body">
        <div class="table-wrapper">
          <table>
            <thead style="border-top: var(--border-default);">
              <tr>
                <th>학번</th>
                <th>이름</th>
                <th>학년</th>
                <th>수강 과목</th>
                <th>등록일</th>
                <th>납부 상태</th>
                <th>상태</th>
                <th class="text-center">액션</th>
              </tr>
            </thead>
            <tbody id="studentTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

  <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.16.0/browser/overlayscrollbars.browser.es5.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script>
  initLayout('students.html');

  const students = [
    { id:'S-2401','name':'김민준','grade':'중등 2학년','subjects':['수학','과학'],'enrolled':'2024.03.02','paid':true,'status':'재원'},
    { id:'S-2402','name':'이서연','grade':'고등 1학년','subjects':['영어','국어'],'enrolled':'2024.03.05','paid':true,'status':'재원'},
    { id:'S-2403','name':'박도윤','grade':'초등 6학년','subjects':['수학','코딩'],'enrolled':'2024.04.10','paid':false,'status':'재원'},
    { id:'S-2404','name':'최수아','grade':'중등 3학년','subjects':['수학','영어','과학'],'enrolled':'2024.01.15','paid':true,'status':'재원'},
    { id:'S-2405','name':'정하은','grade':'고등 2학년','subjects':['국어','사회'],'enrolled':'2023.09.01','paid':true,'status':'재원'},
    { id:'S-2406','name':'강준혁','grade':'초등 5학년','subjects':['코딩'],'enrolled':'2025.01.20','paid':true,'status':'재원'},
    { id:'S-2407','name':'윤지아','grade':'중등 1학년','subjects':['영어','수학'],'enrolled':'2025.03.01','paid':false,'status':'휴원'},
    { id:'S-2408','name':'임서준','grade':'고등 3학년','subjects':['수학','과학'],'enrolled':'2023.03.02','paid':true,'status':'재원'},
    { id:'S-2409','name':'한나연','grade':'초등 4학년','subjects':['국어','코딩'],'enrolled':'2025.09.05','paid':true,'status':'재원'},
    { id:'S-2410','name':'오태양','grade':'중등 2학년','subjects':['수학'],'enrolled':'2024.09.03','paid':false,'status':'퇴원'},
  ];

  const statusBadge = { '재원':'badge-success','휴원':'badge-warning','퇴원':'badge-neutral' };

  const tbody = document.getElementById('studentTableBody');
  tbody.innerHTML = students.map(s => `
    <tr>
      <td class="text-mono">${s.id}</td>
      <td><div class="table-avatar"><div class="avatar-circle">${s.name[0]}</div>${s.name}</div></td>
      <td class="text-secondary">${s.grade}</td>
      <td>${s.subjects.map(sub => `<span class="badge badge-neutral" style="margin-right:2px">${sub}</span>`).join('')}</td>
      <td class="text-secondary">${s.enrolled}</td>
      <td>${s.paid ? `<span class="badge badge-neutral">납부완료</span>` : `<span class="badge badge-danger">미납</span>`}</td>
      <td><span class="badge ${statusBadge[s.status]}"><span class="badge-dot" style="background:currentColor"></span>${s.status}</span></td>
      <td class="text-center">
        <button class="btn btn-secondary btn-sm">상세</button>
      </td>
    </tr>
  `).join('');
</script>
</body>
</html>
