<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항 | CANB 캠퍼스</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.16.0/styles/overlayscrollbars.min.css">
  <link rel="stylesheet" href="styles/common.css">
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>

<div class="main-content">
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-title">공지사항</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" title="알림" aria-label="알림">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
    </div>
  </header>

  <main class="page-content">
    <div class="page-header">
      <div class="page-header-left">
        <h1 class="page-title">공지사항</h1>
        <p class="page-subtitle">학원 공지와 학습 안내를 등록하고 관리합니다</p>
      </div>
      <div class="page-header-actions">
        <button class="btn btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          알림 발송
        </button>
        <button class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          공지 작성
        </button>
      </div>
    </div>

    <!-- 요약 KPI -->
    <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);">
      <div class="kpi-card">
        <div class="kpi-card-header">
          <span class="kpi-label">전체 공지</span>
          <div class="kpi-icon blue" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          </div>
        </div>
        <span class="kpi-value">184</span>
        <div class="kpi-change neutral">이달 12건 등록</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-card-header">
          <span class="kpi-label">중요 공지</span>
          <div class="kpi-icon red" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </div>
        </div>
        <span class="kpi-value">7</span>
        <div class="kpi-change neutral">상단 고정 중</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-card-header">
          <span class="kpi-label">평균 조회수</span>
          <div class="kpi-icon green" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </div>
        </div>
        <span class="kpi-value">342</span>
        <div class="kpi-change positive">▲ 12.4% 지난달 대비</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-card-header">
          <span class="kpi-label">이달 신규</span>
          <div class="kpi-icon cyan" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </div>
        </div>
        <span class="kpi-value">12</span>
        <div class="kpi-change positive">▲ 3건 지난달 대비</div>
      </div>
    </div>

    <!-- 탭 -->
    <div class="tabs" role="tablist">
      <button class="tab-btn active" role="tab" data-cat="전체">전체 (184)</button>
      <button class="tab-btn" role="tab" data-cat="학원공지">학원공지 (89)</button>
      <button class="tab-btn" role="tab" data-cat="학습안내">학습안내 (64)</button>
      <button class="tab-btn" role="tab" data-cat="시험일정">시험일정 (21)</button>
      <button class="tab-btn" role="tab" data-cat="기타">기타 (10)</button>
    </div>

    <!-- 필터 -->
    <div class="filter-bar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" placeholder="공지 제목 검색..." aria-label="공지 검색">
      </div>
      <select class="filter-select" aria-label="기간 필터">
        <option>전체 기간</option>
        <option>이번 달</option>
        <option>최근 3개월</option>
        <option>최근 6개월</option>
      </select>
      <select class="filter-select" aria-label="정렬">
        <option>최신 순</option>
        <option>조회수 순</option>
        <option>중요도 순</option>
      </select>
    </div>

    <!-- 공지 목록 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">공지 목록</div>
      </div>
      <div class="card-body">
        <div class="table-wrapper">
          <table>
            <thead style="border-top: var(--border-default);">
              <tr>
                <th style="width:40px;">중요</th>
                <th>제목</th>
                <th>카테고리</th>
                <th>대상</th>
                <th>작성자</th>
                <th>등록일</th>
                <th class="text-right">조회수</th>
                <th class="text-center">액션</th>
              </tr>
            </thead>
            <tbody id="noticeBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

  <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.16.0/browser/overlayscrollbars.browser.es5.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script>
  initLayout('notices.html');

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
      btn.classList.add('active'); btn.setAttribute('aria-selected','true');
    });
  });

  const notices = [
    { important:true,  title:'2026년 여름방학 특강 안내',           cat:'학원공지', target:'전체', author:'관리자', date:'2026.05.14', views:892 },
    { important:true,  title:'5월 월간 테스트 일정 안내',           cat:'시험일정', target:'전체', author:'관리자', date:'2026.05.13', views:741 },
    { important:true,  title:'[필독] 수강료 납부 마감 안내',         cat:'학원공지', target:'전체', author:'관리자', date:'2026.05.12', views:1024 },
    { important:false, title:'수학 심화반 교재 변경 안내',           cat:'학습안내', target:'수학', author:'박지연', date:'2026.05.11', views:312 },
    { important:false, title:'영어 회화 수업 시간 변경',             cat:'학원공지', target:'영어', author:'최준호', date:'2026.05.10', views:287 },
    { important:false, title:'중간고사 대비 특별 보충 수업 안내',    cat:'학습안내', target:'중등', author:'관리자', date:'2026.05.09', views:456 },
    { important:false, title:'6월 모의고사 신청 안내',               cat:'시험일정', target:'고등', author:'관리자', date:'2026.05.08', views:389 },
    { important:false, title:'코딩 심화반 개설 예정 안내',           cat:'학원공지', target:'전체', author:'강현우', date:'2026.05.07', views:523 },
    { important:false, title:'과학 실험 재료 준비 안내',             cat:'학습안내', target:'과학', author:'이미래', date:'2026.05.06', views:198 },
    { important:false, title:'5월 체험학습 신청 마감 연장',          cat:'기타',     target:'초등', author:'관리자', date:'2026.05.05', views:267 },
    { important:false, title:'수능 D-200 특강 프로그램 안내',        cat:'학습안내', target:'고3',  author:'김태현', date:'2026.05.04', views:834 },
    { important:false, title:'자습실 이용 규칙 변경 안내',           cat:'학원공지', target:'전체', author:'관리자', date:'2026.05.03', views:421 },
  ];

  const catCls = { '학원공지':'badge-neutral','학습안내':'badge-neutral','시험일정':'badge-danger','기타':'badge-neutral' };

  document.getElementById('noticeBody').innerHTML = notices.map(n => `
    <tr>
      <td class="text-center">
        ${n.important ? `<svg viewBox="0 0 24 24" fill="#DC2626" stroke="none" width="16" height="16" aria-label="중요"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>` : ''}
      </td>
      <td class="text-left">
        <a href="#" style="color:var(--color-text-primary);font-weight:${n.important?'var(--weight-medium)':'var(--weight-normal)'};text-decoration:none;"
           onmouseover="this.style.color='var(--color-primary)'" onmouseout="this.style.color='var(--color-text-primary)'">
          ${n.title}
        </a>
      </td>
      <td><span class="badge ${catCls[n.cat]}">${n.cat}</span></td>
      <td class="text-secondary">${n.target}</td>
      <td class="text-secondary">${n.author}</td>
      <td class="text-secondary">${n.date}</td>
      <td class="text-right text-secondary">${n.views.toLocaleString()}</td>
      <td class="text-center" style="white-space:nowrap;">
        <button class="btn btn-secondary btn-sm" style="margin-right:4px;">수정</button>
        <button class="btn btn-ghost btn-sm">삭제</button>
      </td>
    </tr>
  `).join('');
</script>
</body>
</html>
