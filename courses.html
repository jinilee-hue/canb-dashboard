<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수강 관리 | CANB 캠퍼스</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.16.0/styles/overlayscrollbars.min.css">
  <link rel="stylesheet" href="styles/common.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>

<div class="main-content">
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-title">수강 관리</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" title="알림" aria-label="알림">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
    </div>
  </header>

  <main class="page-content">
    <div class="page-header">
      <div class="page-header-left">
        <h1 class="page-title">수강 관리</h1>
        <p class="page-subtitle">개설된 강좌 현황과 수강생을 관리합니다</p>
      </div>
      <div class="page-header-actions">
        <button class="btn btn-secondary">시간표 보기</button>
        <button class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          강좌 개설
        </button>
      </div>
    </div>

    <!-- KPI -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-card-header">
          <span class="kpi-label">개설 강좌</span>
          <div class="kpi-icon blue" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          </div>
        </div>
        <span class="kpi-value">32</span>
        <div class="kpi-change positive">▲ 4개 지난 학기 대비</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-card-header">
          <span class="kpi-label">전체 수강 인원</span>
          <div class="kpi-icon green" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
        </div>
        <span class="kpi-value">1,247</span>
        <div class="kpi-change positive">▲ 3.8% 지난 학기 대비</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-card-header">
          <span class="kpi-label">강좌 평균 인원</span>
          <div class="kpi-icon cyan" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          </div>
        </div>
        <span class="kpi-value">39명</span>
        <div class="kpi-change neutral">정원 45명 기준</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-card-header">
          <span class="kpi-label">정원 충족률</span>
          <div class="kpi-icon purple" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          </div>
        </div>
        <span class="kpi-value">86.7%</span>
        <div class="kpi-change positive">▲ 2.1% 지난 학기 대비</div>
      </div>
    </div>

    <!-- 차트 + 강좌 목록 -->
    <div class="chart-grid-3 section">
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">과목별 수강 인원</div>
            <div class="card-subtitle">현재 학기 기준</div>
          </div>
        </div>
        <div class="card-body">
          <div class="chart-container-md" role="img" aria-label="과목별 수강 인원 막대 차트">
            <canvas id="courseChart"></canvas>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">강좌 상태</div>
        </div>
        <div class="card-body">
          <div class="chart-container-md" role="img" aria-label="강좌 정원 충족률 차트">
            <canvas id="capacityChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- 강좌 목록 -->
    <div class="filter-bar">
      <select class="filter-select" aria-label="과목 필터">
        <option>전체 과목</option>
        <option>수학</option>
        <option>영어</option>
        <option>과학</option>
        <option>국어</option>
        <option>코딩</option>
      </select>
      <select class="filter-select" aria-label="상태 필터">
        <option>전체 상태</option>
        <option>운영중</option>
        <option>마감</option>
        <option>개설예정</option>
      </select>
    </div>
    <div class="card section">
      <div class="card-header">
        <div class="card-title">강좌 목록</div>
      </div>
      <div class="card-body">
        <div class="table-wrapper">
          <table>
            <thead style="border-top: var(--border-default);">
              <tr>
                <th>강좌명</th>
                <th>과목</th>
                <th>담당 강사</th>
                <th>대상 학년</th>
                <th>수업 일정</th>
                <th class="text-right">수강 / 정원</th>
                <th>충족률</th>
                <th>상태</th>
              </tr>
            </thead>
            <tbody id="courseTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

  <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.16.0/browser/overlayscrollbars.browser.es5.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script>
  initLayout('courses.html');

  const courses = [
    { name:'중등 수학 심화반A', subject:'수학', teacher:'박지연', grade:'중등 2-3학년', schedule:'월·수·금 16:00', enrolled:42, cap:45, status:'운영중' },
    { name:'고등 영어 독해반',  subject:'영어', teacher:'최준호', grade:'고등 1-2학년', schedule:'화·목 18:00',  enrolled:38, cap:40, status:'운영중' },
    { name:'초등 수학 기초반',  subject:'수학', teacher:'김태현', grade:'초등 4-6학년', schedule:'월·수 15:00',  enrolled:30, cap:35, status:'운영중' },
    { name:'중등 과학 실험반',  subject:'과학', teacher:'이미래', grade:'중등 1-3학년', schedule:'토 10:00',     enrolled:25, cap:30, status:'운영중' },
    { name:'코딩 입문반',       subject:'코딩', teacher:'강현우', grade:'초등 5-6학년', schedule:'토 14:00',     enrolled:20, cap:20, status:'마감' },
    { name:'고등 국어 논술반',  subject:'국어', teacher:'박지연', grade:'고등 2-3학년', schedule:'화·목 17:00',  enrolled:15, cap:25, status:'운영중' },
    { name:'중등 영어 회화반',  subject:'영어', teacher:'최준호', grade:'중등 1-2학년', schedule:'월·목 17:00',  enrolled:32, cap:35, status:'운영중' },
    { name:'고등 수학 수능반',  subject:'수학', teacher:'김태현', grade:'고등 3학년',   schedule:'월~금 19:00',  enrolled:45, cap:45, status:'마감' },
    { name:'AI 코딩 심화반',    subject:'코딩', teacher:'강현우', grade:'중등 1-3학년', schedule:'토 16:00',     enrolled:12, cap:20, status:'개설예정' },
    { name:'초등 국어 독서반',  subject:'국어', teacher:'이미래', grade:'초등 4-5학년', schedule:'수·금 15:00',  enrolled:28, cap:35, status:'운영중' },
  ];

  const statusCls = { '운영중':'badge-success','마감':'badge-neutral','개설예정':'badge-warning' };

  document.getElementById('courseTableBody').innerHTML = courses.map(c => {
    const ratio = Math.round(c.enrolled / c.cap * 100);
    const barColor = 'var(--chart-1)';
    return `<tr>
      <td class="text-left" style="font-weight:var(--weight-medium)">${c.name}</td>
      <td><span class="badge badge-neutral">${c.subject}</span></td>
      <td class="text-secondary">${c.teacher}</td>
      <td class="text-secondary">${c.grade}</td>
      <td class="text-secondary">${c.schedule}</td>
      <td class="text-right">${c.enrolled} / ${c.cap}</td>
      <td>
        <div style="display:flex;align-items:center;gap:8px;min-width:100px;">
          <div style="flex:1;height:6px;background:var(--color-bg-muted);border-radius:var(--radius-full);overflow:hidden;">
            <div style="width:${ratio}%;height:100%;background:${barColor};border-radius:var(--radius-full);"></div>
          </div>
          <span style="font-size:var(--text-xs);color:var(--color-text-secondary);width:32px;text-align:right;">${ratio}%</span>
        </div>
      </td>
      <td><span class="badge ${statusCls[c.status]}">${c.status}</span></td>
    </tr>`;
  }).join('');

  let _charts = {};

  function buildCharts() {
    setChartDefaults();
    Object.values(_charts).forEach(ch => ch && ch.destroy());
    const c = getChartColors();

    _charts.course = new Chart(document.getElementById('courseChart'), {
      type: 'bar',
      data: {
        labels: ['수학','영어','과학','국어','코딩','사회'],
        datasets: [{
          label: '수강 인원',
          data: [342, 298, 187, 164, 143, 113],
          backgroundColor: [c[0],c[3],c[3],c[3],c[3],c[3]],
          borderRadius: 5,
          barPercentage: 0.45,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false } },
          y: { beginAtZero: true }
        }
      }
    });

    _charts.capacity = new Chart(document.getElementById('capacityChart'), {
      type: 'doughnut',
      data: {
        labels: ['마감 강좌','운영중 (여유)','개설예정'],
        datasets: [{
          data: [8, 21, 3],
          backgroundColor: [c[1],c[0],c[3]],
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        cutout: '60%',
        plugins: { legend: { position: 'bottom', labels: { usePointStyle: true } } }
      }
    });
  }

  buildCharts();
  window.addEventListener('themechange', buildCharts);
</script>
</body>
</html>
